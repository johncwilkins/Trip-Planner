name: Deploy Trip Planner
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notices_only:
        description: 'Notices only: fetch new Coast Guard notices without refreshing NOAA tides'
        type: boolean
        default: true
  schedule:
    - cron: '0 6,7 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trip-planner-pages
  cancel-in-progress: false
jobs:
  coast_guard:
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Import pending source bundle
        run: |
          if [ -f trip-planner-source.zip ]; then
            python - <<'PYCODE'
          import pathlib,zipfile
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('trip-planner-source.zip') as z:
              for entry in z.infolist():
                  target=(root/entry.filename).resolve()
                  if not target.is_relative_to(root) or entry.filename.startswith(('.git/','.github/','.openai/')):
                      raise ValueError('Unexpected path in source bundle')
              z.extractall(root)
          PYCODE
          fi
      - name: Fetch Coast Guard geographic notices
        continue-on-error: true
        run: python scripts/refresh-uscg-notices.py
      - uses: actions/upload-artifact@v4
        with:
          name: coast-guard-notices
          path: |
            dist/nj/uscg-notices.json
            dist/nj/uscg-refresh-status.json
          if-no-files-found: error
  prepare:
    needs: [coast_guard]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Expand initial source upload
        run: |
          if [ -f trip-planner-source.zip ]; then
            python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('trip-planner-source.zip') as z:
              for entry in z.infolist():
                  target=(root/entry.filename).resolve()
                  if not target.is_relative_to(root) or entry.filename.startswith(('.git/','.github/','.openai/')):
                      raise ValueError('Unexpected path in source bundle')
              z.extractall(root)
          PY
            git rm trip-planner-source.zip
          fi
      - name: Decide whether to refresh NOAA
        id: refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          NOTICES_ONLY: ${{ inputs.notices_only }}
        run: |
          python - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          local=datetime.datetime.now(ZoneInfo('America/New_York'))
          refresh=(os.environ['EVENT_NAME']=='workflow_dispatch' and os.environ.get('NOTICES_ONLY')!='true') or (os.environ['EVENT_NAME']=='schedule' and local.hour==2)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(refresh).lower()+'\n')
          PY
      - name: Use refreshed Coast Guard snapshot
        if: needs.coast_guard.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: coast-guard-notices
          path: dist/nj
      - name: Refresh saved weekly current and tide predictions
        if: steps.refresh.outputs.run == 'true'
        run: python scripts/refresh-weekly.py
      - name: Populate new NJ checkpoint tide caches when needed
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          stations=json.loads(pathlib.Path('config/nj-tide-stations.json').read_text())
          manifest=json.loads(pathlib.Path('dist/nj/tides/manifest.json').read_text())
          if any(not (pathlib.Path('dist/nj/tides')/st['id']/(week+'.json')).exists() for st in stations for week in manifest['weeks']):
              subprocess.run(['python','scripts/refresh-nj-tides.py'],check=True)
          PY
      - name: Verify static site and cached predictions
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('dist')
          for name in ['index.html','currents.html','nj.html','app.js','nj-app.js','help.html','about.html','guide.css']:
              assert (root/name).is_file(),name
          assert (root/'CNAME').read_text().strip()=='tripplanner.bitterradish.com'
          for folder in ['predictions','nj/tides']:
              base=root/folder
              manifest=json.loads((base/'manifest.json').read_text())
              for st in manifest['stations']:
                  for week in manifest['weeks']:
                      path=base/st['id']/(week+'.json')
                      assert path.is_file(),str(path)
                      json.loads(path.read_text())
          print('Pages and complete prediction caches verified.')
          PY
      - name: Check NJ priority tide calculations
        run: node scripts/check-nj-checkpoints.cjs
      - name: Save imported source or refreshed NOAA cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore dist config scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Import planner source or refresh marine data caches'
            git push
          fi
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
